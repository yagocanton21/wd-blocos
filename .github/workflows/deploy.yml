name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Deploy to Oracle VPS
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Execute Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/wd-blocos
            
            # Limpa qualquer mudança local para evitar conflito de merge
            git stash || true
            
            # Puxa o código mais recente
            git pull origin main
            
            # Reconstrói e reinicia os containers
            docker compose up -d --build

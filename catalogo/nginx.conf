server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao gzip para assets estaticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache de longa duracao para assets com hash (JS/CSS do Vite)
    location ~* \.(js|css|woff2|woff|ttf|svg|ico|webp|png|jpg|jpeg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy reverso para a API FastAPI
    location /api/ {
        proxy_pass http://api:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy reverso para os uploads estáticos do FastAPI (com ^~ para ter prioridade sobre o regex de arquivos estáticos)
    location ^~ /uploads/ {
        proxy_pass http://api:8001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: todas as rotas vao para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
